org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Forzar UTF-8 también en el daemon de Kotlin (proceso separado del daemon de
# Gradle, con su propia JVM): en Windows, si no se fija explícitamente, puede
# usar el charset por defecto del sistema (p. ej. Windows-1252) en vez de
# UTF-8, lo cual puede corromper la lectura de archivos .kt con acentos/
# caracteres especiales en español y producir errores de compilación sin
# sentido ("unresolved reference" en símbolos que sí existen).
kotlin.daemon.jvm.options=-Dfile.encoding=UTF-8

# Deshabilitar la compilación incremental de Kotlin: fuerza una recompilación
# completa en cada build, eliminando por completo la posibilidad de que una
# caché incremental (IC) corrupta/desincronizada (algo conocido tras añadir
# una dependencia nueva, como ML Kit) produzca errores fantasma en archivos
# que no cambiaron. Es más lento, pero elimina esta clase de problema.
kotlin.incremental=false
